[package]
name = "eleclabel"
version = "0.1.0"
description = "ElecLabel - Analyse et impression d'étiquettes de tableau électrique"
authors = ["ASE Sparkium"]
edition = "2021"

[lib]
name = "eleclabel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools" activé temporairement pour diagnostiquer l'écran blanc (clic droit → Inspecter en release).
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mises à jour automatiques (desktop)
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
