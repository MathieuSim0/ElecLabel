<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bBg" x1="80" y1="40" x2="440" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27364F"/>
      <stop offset="0.55" stop-color="#1A2740"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>
    <linearGradient id="bBolt" x1="256" y1="70" x2="256" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5663"/>
      <stop offset="1" stop-color="#E63946"/>
    </linearGradient>
    <filter id="bGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#E63946" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fond carré arrondi -->
  <rect width="512" height="512" rx="116" fill="url(#bBg)"/>
  <path d="M0 116 A116 116 0 0 1 116 0 L300 0 L0 300 Z" fill="#FFFFFF" opacity="0.05"/>

  <!-- Rail DIN + modules disjoncteurs en bas -->
  <g>
    <!-- barre du rail -->
    <rect x="96" y="392" width="320" height="14" rx="7" fill="#3A4D6E"/>
    <!-- modules -->
    <rect x="104" y="330" width="42" height="62" rx="8" fill="#E8EDF5"/>
    <rect x="154" y="330" width="42" height="62" rx="8" fill="#E8EDF5"/>
    <rect x="204" y="330" width="42" height="62" rx="8" fill="#E63946"/>
    <rect x="266" y="330" width="42" height="62" rx="8" fill="#E8EDF5"/>
    <rect x="316" y="330" width="42" height="62" rx="8" fill="#E8EDF5"/>
    <rect x="366" y="330" width="42" height="62" rx="8" fill="#E8EDF5"/>
    <!-- petites manettes -->
    <rect x="119" y="344" width="12" height="20" rx="3" fill="#9AA8BE"/>
    <rect x="169" y="344" width="12" height="20" rx="3" fill="#9AA8BE"/>
    <rect x="219" y="344" width="12" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="281" y="344" width="12" height="20" rx="3" fill="#9AA8BE"/>
    <rect x="331" y="344" width="12" height="20" rx="3" fill="#9AA8BE"/>
    <rect x="381" y="344" width="12" height="20" rx="3" fill="#9AA8BE"/>
  </g>

  <!-- Éclair principal -->
  <path d="M300 74 L156 266 L250 266 L222 348 L356 196 L262 196 Z"
        fill="url(#bBolt)" filter="url(#bGlow)"
        stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
</svg>
