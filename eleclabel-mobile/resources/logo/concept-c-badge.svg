<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cBg" x1="70" y1="40" x2="450" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2C44"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>
    <linearGradient id="cRing" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2495A"/>
      <stop offset="1" stop-color="#C0303C"/>
    </linearGradient>
    <linearGradient id="cBolt" x1="256" y1="150" x2="256" y2="362" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5663"/>
      <stop offset="1" stop-color="#E63946"/>
    </linearGradient>
    <filter id="cShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E63946" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fond carré arrondi sombre -->
  <rect width="512" height="512" rx="116" fill="url(#cBg)"/>
  <path d="M0 116 A116 116 0 0 1 116 0 L300 0 L0 300 Z" fill="#FFFFFF" opacity="0.05"/>

  <!-- Anneau -->
  <circle cx="256" cy="256" r="150" stroke="url(#cRing)" stroke-width="26" fill="none"/>
  <!-- petits points cardinaux sur l'anneau -->
  <circle cx="256" cy="92" r="13" fill="#E63946"/>
  <circle cx="256" cy="420" r="13" fill="#E63946"/>

  <!-- Éclair central -->
  <path d="M288 138 L168 298 L246 298 L222 374 L344 244 L266 244 Z"
        fill="url(#cBolt)" filter="url(#cShadow)"
        stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
</svg>
