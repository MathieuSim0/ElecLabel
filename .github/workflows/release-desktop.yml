# Build + publication automatique sur GitHub Releases au push d'un tag (ex: v1.0.4).
#  - Job "desktop" : build le .exe Windows signé, CRÉE la Release (+ latest.json).
#  - Job "apk"     : build l'APK Android, l'AJOUTE à la même Release (après desktop).
# Un seul workflow → pas de conflit de création de release entre desktop et mobile.
#
# Secrets GitHub requis :
#   TAURI_SIGNING_PRIVATE_KEY           = contenu du fichier eleclabel/eleclabel-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  = (vide)
#   VITE_SUPABASE_URL                   = https://czixrnsfanajtkmilian.supabase.co
#   VITE_SUPABASE_ANON_KEY              = ta clé anon Supabase
#
# Publier : bump version dans tauri.conf.json, puis git tag vX.Y.Z && git push --tags

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ─────────── Desktop Windows (.exe) — crée la Release ───────────
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: eleclabel/src-tauri

      - name: Créer le fichier .env
        shell: bash
        run: |
          cat > eleclabel/.env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_AI_PROXY=true
          EOF

      - name: Installer dépendances npm
        working-directory: eleclabel
        run: npm ci

      - name: Build + signature + création Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: eleclabel
          tagName: ${{ github.ref_name }}
          releaseName: "ElecLabel ${{ github.ref_name }}"
          releaseBody: "Mise à jour ElecLabel. L'installation est automatique pour les utilisateurs existants."
          releaseDraft: false
          prerelease: false

  # ─────────── Mobile APK — ajouté à la Release après le desktop ───────────
  apk:
    needs: desktop # attend que la Release existe (créée par le job desktop)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Créer le fichier .env
        run: |
          cat > eleclabel-mobile/.env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_AI_PROXY=true
          EOF

      - name: Installer dépendances npm
        working-directory: eleclabel-mobile
        run: npm ci

      - name: Build frontend
        working-directory: eleclabel-mobile
        run: npm run build

      - name: Préparer projet Android
        working-directory: eleclabel-mobile
        run: |
          npx cap add android || echo "android/ déjà présent"
          npx cap sync android
          node scripts/patch-android-manifest.mjs

      - name: Build APK
        working-directory: eleclabel-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Renommer l'APK
        working-directory: eleclabel-mobile
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/ElecLabel-${{ github.ref_name }}.apk"

      - name: Ajouter l'APK à la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: eleclabel-mobile/out/ElecLabel-${{ github.ref_name }}.apk
